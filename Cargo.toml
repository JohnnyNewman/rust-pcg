[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.89"

[workspace.dependencies]
pcg-core = { path = "crates/pcg-core" }
pcg-syntax = { path = "crates/pcg-syntax" }
pcg-layout = { path = "crates/pcg-layout" }
rustc-hash = "2"
rayon = "1.12"
walkdir = "2.5"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
tree-sitter = "0.27"
tree-sitter-rust = "0.24"
# No gamepad (gilrs/udev) or audio: an IDE does not need them.
bevy = { version = "0.19.1", default-features = false, features = ["default_app", "std", "bevy_winit", "multi_threaded", "x11", "wayland", "default_font", "2d_bevy_render"] }
bevy_egui = { version = "0.42", default-features = false, features = ["render", "default_fonts", "manage_clipboard"] }

# Fast iteration in dev, but keep dependencies (bevy, tree-sitter) optimized.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 16
